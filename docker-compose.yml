services:
  # One-shot install: `docker compose run --rm install`
  install:
    build: .
    image: chronoccg-dev
    working_dir: /workspace/plugin
    volumes:
      - ./plugin:/workspace/plugin
    command: npm install

  # Type-check + production build: `docker compose run --rm build`
  build:
    build: .
    image: chronoccg-dev
    working_dir: /workspace/plugin
    volumes:
      - ./plugin:/workspace/plugin
    command: npm run build

  # Long-running watch mode: `docker compose up dev`
  dev:
    build: .
    image: chronoccg-dev
    working_dir: /workspace/plugin
    volumes:
      - ./plugin:/workspace/plugin
    command: npm run dev

  # Drop into a shell: `docker compose run --rm shell`
  shell:
    build: .
    image: chronoccg-dev
    working_dir: /workspace/plugin
    volumes:
      - ./plugin:/workspace/plugin
    entrypoint: sh
