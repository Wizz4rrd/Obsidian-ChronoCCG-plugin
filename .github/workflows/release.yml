# Push a tag matching the manifest version (e.g. `1.0.0`, no "v" prefix) to
# build the plugin and publish a draft GitHub release with the files Obsidian
# needs: main.js, manifest.json, styles.css.
name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write
  # Artifact attestations: signed provenance for the release files.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check tag matches manifest
        run: test "$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            plugin/main.js
            plugin/manifest.json
            plugin/styles.css
      # A tag with a "-" (e.g. 2.1.0-beta.1) is a beta: marked as a pre-release.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --draft $prerelease --title "$GITHUB_REF_NAME" --generate-notes main.js manifest.json styles.css
